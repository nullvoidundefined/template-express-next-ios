name: TemplateApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    SWIFT_VERSION: "6.0"
packages:
  AppCore:
    path: Packages/AppCore
targets:
  App:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: AppCore
      - target: WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.templateapp
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREPROCESSOR_DEFINITIONS: ALLOW_LOCAL_NETWORKING_$(ALLOW_LOCAL_NETWORKING)
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    preBuildScripts:
      - name: Require HTTPS API_BASE_URL
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            case "$API_BASE_URL" in
              https://*) ;;
              *)
                echo "error: Release builds need API_BASE_URL to start with https:// (pass API_BASE_URL=https://your-host)."
                exit 1
                ;;
            esac
          fi
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [tests/AppUITests]
    dependencies:
      - target: App
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.templateapp.uitests
  WatchApp:
    type: application
    platform: watchOS
    sources: [WatchApp]
    dependencies:
      - package: AppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.templateapp.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TemplateApp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.templateapp
        INFOPLIST_KEY_WKApplication: YES
schemes:
  App:
    build:
      targets:
        App: all
    test:
      targets: [AppUITests]
  WatchApp:
    build:
      targets:
        WatchApp: all
